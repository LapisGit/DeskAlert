name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: 'qtmultimedia qtwayland'
          cache: 'true'

      - name: Build portable bundle
        run: bash ./scripts/build-linux.sh
        env:
          QT_DIR: ${{ env.QT_ROOT_DIR }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskalert-linux-x64
          path: DeskAlert-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
